<html>

<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      max-width: 600px;
      margin: 0 auto;
    }

    .header {
      background-color: #4F46E5;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      color: white;
      margin: 0;
    }

    .content {
      padding: 20px;
      background-color: #f9f9f9;
    }

    .button {
      display: inline-block;
      background-color: #4F46E5;
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 4px;
      margin-top: 15px;
    }

    .footer {
      text-align: center;
      padding: 10px;
      font-size: 0.8em;
      color: #666;
    }
  </style>
</head>

<body>
  <div class="header">
    <h1>Confirme seu cadastro</h1>
  </div>
  <div class="content">
    <p>Olá!</p>
    <p>Obrigado por se cadastrar em nossa plataforma. Para confirmar seu email e começar a usar nosso sistema, clique no
      botão abaixo:</p>

    <div style="text-align: center;">
      <a href="{{ .ConfirmationURL }}" class="button">Confirmar meu email</a>
    </div>

    <p>Se você não solicitou este cadastro, por favor ignore este email.</p>
  </div>
  <div class="footer">
    <p>EncontraTCC © 2025 - Todos os direitos reservados</p>
  </div>
</body>

</html>
